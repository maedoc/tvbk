name: Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
     - master
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v6
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: pypa/cibuildwheel@v3.3
      env:
        # skip lots of irrelevant stuff to keep gha fast
        # also skip Python 3.8 as nanobind no longer supports it
        CIBW_SKIP: 'pp* *i686 *win32 *musl* *universal2 cp38-*'
        CIBW_TEST_REQUIRES: pytest pytest-benchmark numpy scipy tvb-library
    
    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        path: wheelhouse/*.whl
        name: dist-${{ matrix.os }}

  build_pyodide_wheel:
    name: Pyodide wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: install cibuildwheel
      run: pip install cibuildwheel

    - name: build pyiodide wheel
      run: cibuildwheel --platform pyodide
    
    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        path: wheelhouse/*.whl
        name: dist-pyodide

  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist, build_pyodide_wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/setup-python@v6

    - uses: actions/download-artifact@v7
      with:
        pattern: dist-*
        merge-multiple: true

    - name: fix wheel location
      run: |
        mkdir -p dist
        cp -v *.whl dist/
        rm -v dist/*pyodide*.whl
        find . -name '*.whl'

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_PASSWORD }}

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        path: dist/*.whl
        name: wheels.zip
